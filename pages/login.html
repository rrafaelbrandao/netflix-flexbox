<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/login.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <title>Document</title>
</head>
<body>
    <header>

            <!-- Logo da Netflix-->
            <a class="logo-netflix" href="">
                <img src="/assets/icons/logo-netflix.svg" alt="">
            </a>

    </header>

    <main>
        <section class="login">
            <h1 class="fonte-inter">
                Entrar
            </h1>

            <input class="campo-email" type="text" placeholder="Email ou número de celular">
            
            <input class="campo-senha" type="password" placeholder="Senha">

            <a class="botao-entrar" href="/pages/perfis.html">Entrar</a>

            <span>OU</span>

            <a class="botao-codigo" href="/pages/perfis.html">Use um código de login</a>

            <span>Esqueceu sua senha ?</span>

            <div class="login__lembrar">
                <input class="checkbox-personalizado" type="checkbox" id="lembrar-me">
                <label class="fonte-inter label-lembrar" for="lembrar-me">Lembre de mim</label>
            </div>

            <p class="fonte-inter">
                É sua primiera vez na Netflix ? Inscreva-se agora.  
            </p>

        </section>
    </main>
</body>
</html>
