<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/perfis.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <title>Document</title>
</head>
<body>
    <header>

            <!-- Logo da Netflix-->
            <a class="logo-netflix" href="">
                <img src="/assets/icons/logo-netflix.svg" alt="">
            </a>

    </header>

    <main>
        <section class="perfis">
            <h1 class="fonte-inter">
                Quem está assistindo ?
            </h1>

            <div class="perfis__cards">
                <div class="card">
                    <a href="/pages/profile.html">
                        <img src="/assets/icons/patricia-perfil-icone.png" alt="Perfil Patricia">
                        <h2 class="fonte-inter">Patricia</h2>
                    </a>
                </div>
                <div class="card">
                    <a href="/pages/profile.html">
                        <img src="/assets/icons/rafael-perfil-icone.png" alt="Perfil Rafael">
                        <h2 class="fonte-inter">Rafael</h2>
                    </a>
                </div>
                <div class="card">
                    <a href="/pages/profile.html">
                        <img src="/assets/icons/barbara-perfil-icone.png" alt="Perfil Bárbara">
                        <h2 class="fonte-inter">Bárbara</h2>
                    </a>
                </div>
                <div class="card">
                    <a href="/pages/profile.html">
                        <img src="/assets/icons/infantil-perfil-icone.png" alt="Perfil Infantil">
                        <h2 class="fonte-inter">Infantil</h2>
                    </a>
                </div>
            </div>

            <button class="perfis__gerenciar"> Gerenciar perfis</button>
        </section>
    </main>
</body>
</html>
